<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="詰棋練習">
<meta name="theme-color" content="#f5f2ec">
<title>詰棋練習</title>
<style>
  :root {
    --bg: #f5f2ec;
    --surface: #ffffff;
    --ink: #1f2328;
    --muted: #6b6f76;
    --line: #e3ded4;
    --accent: #22577a;
    --accent-soft: #e4eef5;
    --good: #2e7d4f;
    --good-soft: #e3f3e8;
    --bad: #c0392b;
    --bad-soft: #fbe7e4;
    --warn-soft: #fdf3dc;
    --wood: #dcb46c;
    --hdr: 56px;
    --pad: 16px;
    --panel: 340px;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- 頂部列 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    height: var(--hdr);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 var(--pad);
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .brand-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sync {
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
    font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .sync i { width: 8px; height: 8px; border-radius: 50%; background: #b9b2a5; }
  .sync.ok i { background: var(--good); }
  .sync.busy i { background: var(--accent); animation: pulse 1s infinite; }
  .sync.warn i { background: #d59a00; }
  .sync.bad i { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (max-width: 600px) { .sync span { display: none; } }

  /* ---------- 分段控制 ---------- */
  .seg {
    display: inline-flex; background: #ebe6dc; border-radius: 10px; padding: 3px; gap: 2px;
  }
  .seg button {
    border: 0; background: transparent; border-radius: 8px;
    min-height: 38px; padding: 0 16px; font-weight: 600; color: var(--muted);
    cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg.full { display: flex; width: 100%; }
  .seg.full button { flex: 1; padding: 0 8px; }

  /* ---------- 按鈕 ---------- */
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface);
    font-weight: 600; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: scale(.98); background: #f2efe8; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:active { background: #1a4560; }
  .btn.danger { color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding: 0 8px; }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row > .btn { flex: 1; }

  /* ---------- 版面 ----------
     棋盤為 橫13 × 直8（寬約為高的 1.57 倍）。
     橫放：左欄＝棋盤＋下方題目說明；右欄＝操作。直放：全部由上往下排。 */
  .view { display: none; padding: var(--pad); gap: var(--pad); }
  .view.active { display: grid; }
  .split {
    --avail-h: calc(100vh - var(--hdr) - 2 * var(--pad));
    --avail-h: calc(100dvh - var(--hdr) - 2 * var(--pad));
    --bw: min(calc(100vw - var(--panel) - 3 * var(--pad)), calc((var(--avail-h) - 200px) * 1.5714));
    grid-template-columns: var(--bw) minmax(280px, 420px);
    justify-content: center; align-items: start;
  }
  .split > .panel { max-height: var(--avail-h); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .board-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .under-board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: stretch; }
  #view-edit .under-board { grid-template-columns: 1fr; }
  @media (orientation: portrait), (max-width: 760px) {
    .split {
      --bw: min(calc(100vw - 2 * var(--pad)), 960px);
      grid-template-columns: minmax(0, var(--bw));
    }
    .split > .panel { max-height: none; overflow: visible; }
  }
  @media (max-width: 600px) { .under-board { grid-template-columns: 1fr; } }
  .board-wrap { width: var(--bw); height: calc(var(--bw) / 1.5714); min-width: 280px; min-height: 178px; }
  .board-wrap canvas {
    width: 100%; height: 100%; display: block; border-radius: 10px;
    touch-action: none; -webkit-user-select: none; user-select: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); cursor: pointer;
  }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

  /* ---------- 題目資訊 ---------- */
  .prob-meta { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 2px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }
  .chip.warn { background: var(--warn-soft); color: #8a5a00; }
  .timer { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .timer.done { color: var(--good); }
  .timer.fail { color: var(--bad); }
  .prob-title { font-size: 19px; font-weight: 700; margin: 0; line-height: 1.35; }
  .prob-desc { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  .status { border-radius: var(--radius); padding: 12px 14px; background: var(--accent-soft); }
  .status b { display: block; font-size: 16px; }
  .status span { font-size: 14px; color: #3d4248; }
  .status.good { background: var(--good-soft); } .status.good b { color: var(--good); }
  .status.bad { background: var(--bad-soft); } .status.bad b { color: var(--bad); }
  .status.warn { background: var(--warn-soft); }

  .filter-row { display: flex; gap: 8px; }
  .filter-row select { flex: 1; min-width: 0; }

  select, input[type=text], textarea {
    min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); padding: 0 12px; width: 100%;
  }
  textarea { padding: 10px 12px; resize: vertical; }
  .field { display: block; margin-bottom: 10px; }
  .field > label { display: block; font-size: 14px; color: var(--muted); }
  .field > input, .field > select, .field > textarea { margin-top: 4px; color: var(--ink); font-size: 16px; }
  /* iPad：文字欄位要能長按移動游標、選取部分文字 */
  input, textarea {
    -webkit-user-select: text; user-select: text;
    -webkit-touch-callout: default; touch-action: auto;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row > * { flex: 1; min-width: 0; }

  .mastery { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #ddd6c8; display: inline-block; }
  .dots i.on { background: var(--good); }

  /* ---------- 紀錄清單 ---------- */
  .hist { display: flex; flex-direction: column; gap: 6px; }
  .hist-item { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 10px; cursor: pointer; }
  .hist-item:active { background: #f3f0ea; }
  .hist-item canvas, .hist-item img { width: 72px; height: 46px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .hist-item .r { font-weight: 600; font-size: 15px; }
  .hist-item .r.ok { color: var(--good); } .hist-item .r.ng { color: var(--bad); }
  .hist-item .d { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px 0; }

  /* ---------- 製題 ---------- */
  .move-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; }
  .move-chip { font-size: 13px; padding: 3px 8px; border-radius: 6px; background: #f1ede5; }
  .move-chip.B { background: #2b2b2b; color: #fff; }
  .move-chip.W { background: #fff; border: 1px solid #ccc; }
  .hint-text { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

  /* ---------- 題庫 ---------- */
  .lib { max-width: 900px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .lib-tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .lib-tools select { width: auto; flex: 0 1 170px; }
  .lib-tools input { flex: 1 1 160px; width: auto; }
  .lib-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .lib-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .lib-item:first-child { border-top: 0; }
  .lib-item.current { background: #f6f9fb; }
  .lib-item canvas { width: 84px; height: 54px; border-radius: 6px; flex-shrink: 0; cursor: pointer; }
  .lib-item .info { flex: 1; min-width: 0; cursor: pointer; }
  .lib-item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-item .m { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lib-item .acts { display: flex; gap: 4px; }
  .lib-count { font-size: 14px; color: var(--muted); }
  .lib-count-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  /* ---------- 對話框 ---------- */
  .modal { position: fixed; inset: 0; background: rgba(20,20,20,.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal.open { display: flex; }
  .modal .box { background: var(--surface); border-radius: 16px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow: auto; }
  .modal h2 { margin: 0 0 12px; font-size: 19px; }
  .modal .box.review { width: auto; text-align: center; }
  .modal .box.review canvas { width: min(80vw, 560px); height: calc(min(80vw, 560px) / 1.5714); border-radius: 8px; display: block; margin: 0 auto 12px; }
  .radio-row { display: flex; gap: 16px; margin: 10px 0; font-size: 15px; flex-wrap: wrap; }
  .radio-row label { display: flex; align-items: center; gap: 6px; min-height: 36px; }
  .radio-row input { width: 20px; height: 20px; }
  .import-result { margin-top: 12px; font-size: 14px; }
  .import-result ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); max-height: 160px; overflow: auto; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: #2b2f33; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: all .2s; z-index: 60; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
  body:not(.is-admin) .admin-only { display: none !important; }

  /* ---------- 登入 / 帳號 ---------- */
  .login-cover { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px; }
  .login-cover.open { display: flex; }
  .login-cover .box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(400px, 100%); }
  .login-cover h2 { margin: 0 0 4px; font-size: 22px; }
  .acct-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 10px 0; }
  .acct-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .acct-row:first-child { border-top: 0; }
  .acct-row .n { flex: 1; min-width: 90px; font-weight: 600; }
  .acct-row .n small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .acct-row.off .n { color: var(--muted); text-decoration: line-through; }

  /* ---------- 統計 ---------- */
  .stats { max-width: 960px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .stats-tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .stats-tools select { width: auto; flex: 1 1 150px; }
  #psTiles { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .tile .k { font-size: 13px; color: var(--muted); }
  .tile .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .tile .s { font-size: 12px; color: var(--muted); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .chart-box { position: relative; }
  .chart-box canvas { width: 100%; height: 160px; display: block; touch-action: pan-y; }
  .chart-tip { position: absolute; pointer-events: none; background: #2b2f33; color: #fff; font-size: 13px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); z-index: 2; }
  .heat { display: flex; flex-wrap: wrap; gap: 3px; }
  .heat i { width: 16px; height: 16px; border-radius: 3px; background: #ebe6dc; cursor: pointer; }
  .heat i.tried0 { background: #b7d3f6; }
  .heat i.lv1 { background: #86b6ef; } .heat i.lv2 { background: #5598e7; } .heat i.lv3 { background: #2a78d6; }
  .heat i.lv4 { background: #1c5cab; } .heat i.lv5 { background: #0d366b; }
  .heat-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; align-items: center; }
  .heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 4px; }
  .heat-group { font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .heat-group:first-child { margin-top: 0; }
  .ov-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ov-table th, .ov-table td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
  .ov-table th { color: var(--muted); font-weight: 600; border-top: 0; }
  .ov-table td.num { font-variant-numeric: tabular-nums; }
  .ov-table tr[data-uid] { cursor: pointer; }
  .ov-wrap { overflow-x: auto; }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: 0; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-row">
    <div class="brand">詰棋練習</div>
    <button class="sync hidden" id="syncBtn" title="帳號與同步"><i></i><span>同步中…</span></button>
  </div>
  <nav class="seg" id="tabs">
    <button data-tab="play" aria-pressed="true">練習</button>
    <button data-tab="stats" aria-pressed="false">統計</button>
    <button data-tab="lib" aria-pressed="false">題庫</button>
    <button data-tab="edit" aria-pressed="false" class="admin-only">製題</button>
  </nav>
</header>

<!-- ================= 練習 ================= -->
<main id="view-play" class="view split active">
  <div class="board-col">
    <div class="board-wrap"><canvas id="playBoard"></canvas></div>
    <div class="under-board">
      <div class="card prob-card">
        <div class="prob-meta"><span class="chip" id="pCat"></span><span id="pId"></span><span class="chip warn hidden" id="pWarn">資料有誤</span><span class="timer" id="pTimer">⏱ 0:00</span></div>
        <h2 class="prob-title" id="pTitle"></h2>
        <p class="prob-desc" id="pDesc"></p>
      </div>
      <div class="status" id="pStatus"><b></b><span></span></div>
    </div>
  </div>
  <aside class="panel">

    <div class="seg full" id="modeSeg">
      <button data-mode="AUTO" aria-pressed="true">自動應答</button>
      <button data-mode="FREE" aria-pressed="false">自由擺子</button>
    </div>

    <div class="btn-row">
      <button class="btn" id="btnReset">重來</button>
      <button class="btn hidden" id="btnUndo">悔一手</button>
      <button class="btn hidden" id="btnCheck">對答案</button>
    </div>

    <div class="filter-row">
      <select id="playGroup" aria-label="大類"></select>
      <select id="playCat" aria-label="子類"></select>
    </div>
    <button class="btn primary" id="btnNext" style="width:100%">下一題</button>

    <div class="card">
      <div class="mastery">
        <span>熟練度<span class="dots" id="pDots"></span></span>
        <span id="pStreak"></span>
      </div>
    </div>

    <div class="card">
      <h3>作答紀錄 <button class="btn ghost small" id="btnClearHist">清除</button></h3>
      <div class="hist" id="histList"></div>
    </div>
  </aside>
</main>

<!-- ================= 製題 ================= -->
<main id="view-edit" class="view split">
  <div class="board-col">
    <div class="board-wrap"><canvas id="editBoard"></canvas></div>
    <div class="under-board">
      <div class="card">
        <h3>正解手順
          <span class="seg" id="firstSeg">
            <button data-first="B" aria-pressed="true">黑先</button>
            <button data-first="W" aria-pressed="false">白先</button>
          </span>
        </h3>
        <div class="move-list" id="moveList"></div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn small" id="btnEdUndo">悔一手</button>
          <button class="btn small danger" id="btnEdClear">清空盤面</button>
        </div>
      </div>

    </div>
  </div>
  <aside class="panel">
    <div class="card">
      <h3><span id="edHeading">新增題目</span> <button class="btn ghost small" id="btnEdNew">開新題</button></h3>
      <div class="seg full" id="toolSeg">
        <button data-tool="B" aria-pressed="true">● 黑子</button>
        <button data-tool="W" aria-pressed="false">○ 白子</button>
        <button data-tool="T" aria-pressed="false">◎ 目標</button>
        <button data-tool="M" aria-pressed="false">錄手順</button>
      </div>
      <p class="hint-text" id="toolHint"></p>
    </div>

    <div class="card">
      <h3>題目資訊</h3>
      <div class="field-row">
        <div class="field"><label for="edGroup">大類</label><input type="text" id="edGroup" list="groupList" placeholder="例如：階三"></div>
        <div class="field"><label for="edCat">子類</label><input type="text" id="edCat" list="catList" placeholder="例如：死活"></div>
      </div>
      <div class="field"><label for="edId">題號</label><input type="text" id="edId" placeholder="自動"></div>
      <div class="field"><label for="edTitle">名稱</label><input type="text" id="edTitle" placeholder="例如：倒撲吃子"></div>
      <div class="field"><label for="edDesc">說明 / 提示</label><textarea id="edDesc" rows="2" placeholder="例如：黑先，注意撲的手筋"></textarea></div>
      <button class="btn primary" style="width:100%" id="btnEdSave">儲存題目</button>
    </div>
    <datalist id="catList"></datalist>
    <datalist id="groupList"></datalist>
  </aside>
</main>

<!-- ================= 題庫 ================= -->
<main id="view-lib" class="view">
  <div class="lib">
    <div class="lib-tools">
      <select id="libGroup" aria-label="大類"></select>
      <select id="libCat" aria-label="子類"></select>
      <input type="text" id="libSearch" placeholder="搜尋題號或名稱">
      <button class="btn admin-only" id="btnImport">匯入</button>
      <button class="btn admin-only" id="btnExport">匯出</button>
      <button class="btn primary admin-only" id="btnLibNew">新增題目</button>
    </div>
    <div class="lib-count-row">
      <div class="lib-count" id="libCount"></div>
      <button class="btn small danger hidden admin-only" id="btnDelGroup"></button>
    </div>
    <div class="lib-list" id="libList"></div>
  </div>
</main>

<!-- ================= 統計 ================= -->
<main id="view-stats" class="view">
  <div class="stats">
    <div class="stats-tools">
      <select id="statUser" class="admin-only" aria-label="檢視的使用者"></select>

<script>
'use strict';
/* =========================================================
   基本設定與座標
   ========================================================= */
const APP_VERSION = '2026.11.18a';             // 顯示在題庫頁，用來確認 iPad 載入的是不是最新版
const LETTERS = 'ABCDEFGHJKLMNOPQRST';     // 跳過 I（圍棋慣例）
const STORE_KEY = 'go_tsumego_deck_v4';      // 只存題目；個人作答紀錄另外存（見「作答紀錄」）
const OLD_STORE_KEYS = ['go_tsumego_deck_v3', 'go_tsumego_deck_v2', 'go_tsumego_deck'];
const SIZES = [9, 13, 19];
// 所有題目都放在 19 路大棋盤的左下角，只顯示 橫 13（A–N）× 直 8（1–8）
const BOARD = 19, VIEW_COLS = 13, VIEW_ROWS = 8;
const VIEW_TOP = BOARD - VIEW_ROWS;            // 可見區域最上面一行的 grid row index
const inView = (c, r) => c >= 0 && c < VIEW_COLS && r >= VIEW_TOP && r < BOARD;
const $ = id => document.getElementById(id);
const other = c => (c === 'B' ? 'W' : 'B');
const colorName = c => (c === 'B' ? '黑' : '白');

function parseCoord(s, size) {
  if (typeof s !== 'string') return null;
  const m = s.trim().toUpperCase().match(/^([A-HJ-T])(\d{1,2})$/);
  if (!m) return null;
  const c = LETTERS.indexOf(m[1]), n = +m[2];
  if (c < 0 || c >= size || n < 1 || n > size) return null;
  return { c, r: size - n };
}
const toCoord = (c, r, size) => LETTERS[c] + (size - r);

/* =========================================================
   圍棋規則：落子、提子、禁著
   ========================================================= */
function neighbors(i, size) {
  const c = i % size, r = (i - c) / size, out = [];
  if (c > 0) out.push(i - 1);
  if (c < size - 1) out.push(i + 1);
  if (r > 0) out.push(i - size);
  if (r < size - 1) out.push(i + size);
  return out;
}
function groupAt(grid, size, i) {
  const color = grid[i], seen = new Set([i]), stack = [i];
  let libs = 0; const libSeen = new Set();
  while (stack.length) {
    const p = stack.pop();
    for (const n of neighbors(p, size)) {
      if (grid[n] === color && !seen.has(n)) { seen.add(n); stack.push(n); }
      else if (!grid[n] && !libSeen.has(n)) { libSeen.add(n); libs++; }
    }
  }
  return { stones: [...seen], libs };
}
/** 在 grid 上落子；成功回傳 {ok, captured}，失敗回傳 {ok:false, reason} */
function applyMove(grid, size, c, r, color) {
  const i = r * size + c;
  if (grid[i]) return { ok: false, reason: '此處已有棋子' };
  grid[i] = color;
  const captured = [];
  for (const n of neighbors(i, size)) {
    if (grid[n] === other(color)) {
      const g = groupAt(grid, size, n);
      if (g.libs === 0) g.stones.forEach(s => { grid[s] = null; captured.push(s); });
    }
  }
  if (groupAt(grid, size, i).libs === 0) { grid[i] = null; return { ok: false, reason: '此處是禁著點（無氣）' }; }
  return { ok: true, captured };
}
/** 題目的目標棋子 → grid index */
function targetIdx(p) {
  return (p.targets || []).map(s => parseCoord(s, p.boardSize)).filter(Boolean).map(q => q.r * p.boardSize + q.c);
}
/** 依題目初始盤面 + 手順，算出目前盤面 */
function computePosition(p, moves) {
  const size = p.boardSize, grid = new Array(size * size).fill(null), nums = new Map();
  p.initialBlack.forEach(s => { const q = parseCoord(s, size); if (q) grid[q.r * size + q.c] = 'B'; });
  p.initialWhite.forEach(s => { const q = parseCoord(s, size); if (q) grid[q.r * size + q.c] = 'W'; });
  let illegal = -1, reason = '';
  for (let k = 0; k < moves.length; k++) {
    const q = parseCoord(moves[k].coord, size);
    if (!q) { illegal = k; reason = '座標錯誤'; break; }
    const res = applyMove(grid, size, q.c, q.r, moves[k].color);
    if (!res.ok) { illegal = k; reason = res.reason; break; }
    res.captured.forEach(s => nums.delete(s));
    nums.set(q.r * size + q.c, k + 1);
  }
  return { size, grid, nums, illegal, reason };
}

/* =========================================================
   題目資料：統一格式、相容舊格式、驗證
   統一格式：
   { id, group, category, title, desc, boardSize,     ← group＝大類（例：階三），category＝子類（例：死活）
     initialBlack:["C3",...], initialWhite:[...],
     solution:[{coord:"B2", color:"B", note?}],
     targets?:["D3",...]   ← 攻殺題要吃掉的棋子（畫成雙圓）
   個人的作答紀錄不在題目裡，見「作答紀錄」 }
   ========================================================= */
function normalizeProblem(raw, idx) {
  if (!raw || typeof raw !== 'object') return { error: `第 ${idx + 1} 筆不是題目物件` };
  const label = raw.id || raw.title || `第 ${idx + 1} 筆`;
  const black = raw.initialBlack ?? raw.initial?.black ?? raw.black ?? [];
  const white = raw.initialWhite ?? raw.initial?.white ?? raw.white ?? [];
  const solRaw = raw.solution ?? raw.moves ?? [];
  if (!Array.isArray(black) || !Array.isArray(white) || !Array.isArray(solRaw))
    return { error: `${label}：初始棋子或正解格式不正確` };
  if (solRaw.length === 0) return { error: `${label}：沒有正解手順` };

  const solCoord = m => (typeof m === 'string' ? m : (m.coord ?? m.move));
  const all = [...black, ...white, ...solRaw.map(solCoord)].map(String);
  let size = +raw.boardSize || +raw.size || 0;
  if (!SIZES.includes(size)) size = SIZES.find(sz => all.every(s => parseCoord(s, sz))) || 19;

  // ---- 轉換到 13×8 視窗（大棋盤左下角）----
  // 用 x = 欄（0 起算）、y = 路（1 起算，由下往上）
  const pts = all.map(s => parseCoord(s, size)).filter(Boolean).map(q => ({ x: q.c, y: size - q.r }));
  if (!pts.length) return { error: `${label}：沒有任何棋子` };
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  // 靠右邊線 → 左右鏡射到左邊線；靠上邊線 → 上下鏡射到下邊線（保留邊線的意義）
  const flipX = maxX === size - 1 && minX > 0 && !(size === BOARD && maxX < VIEW_COLS);
  const flipY = maxY === size && minY > 1 && !(size === BOARD && maxY <= VIEW_ROWS);
  const fx = x => (flipX ? size - 1 - x : x), fy = y => (flipY ? size + 1 - y : y);
  const tx = pts.map(p => fx(p.x)), ty = pts.map(p => fy(p.y));
  const shiftX = Math.max(0, Math.max(...tx) - (VIEW_COLS - 1));
  const shiftY = Math.max(0, Math.max(...ty) - VIEW_ROWS);
  if (Math.min(...tx) - shiftX < 0 || Math.min(...ty) - shiftY < 1)
    return { error: `${label}：棋形太大，放不進 13×8 的範圍` };
  const mapCoord = s => {
    const q = parseCoord(String(s), size);
    if (!q) return null;
    const x = fx(q.c) - shiftX, y = fy(size - q.r) - shiftY;
    if (x < 0 || x >= VIEW_COLS || y < 1 || y > VIEW_ROWS) return null;
    return LETTERS[x] + y;
  };
  const norm = mapCoord;

  const bad = [];
  const ib = black.map(s => norm(s) || (bad.push(s), null)).filter(Boolean);
  const iw = white.map(s => norm(s) || (bad.push(s), null)).filter(Boolean);
  let firstColor = null;
  const solution = solRaw.map((m, k) => {
    const coord = norm(typeof m === 'string' ? m : (m.coord ?? m.move));
    if (!coord) { bad.push(typeof m === 'string' ? m : (m.coord ?? m.move)); return null; }
    let color = String((typeof m === 'object' && m.color) || '').toUpperCase()[0];
    if (color !== 'B' && color !== 'W') color = k === 0 ? 'B' : null;
    if (k === 0) firstColor = color;
    const out = { coord, color: color || (k % 2 === 0 ? firstColor : other(firstColor)) };
    if (typeof m === 'object' && m.note) out.note = String(m.note);
    return out;
  }).filter(Boolean);
  if (bad.length) return { error: `${label}：無法辨識的座標 ${bad.slice(0, 3).join('、')}` };
  const dup = ib.find(s => iw.includes(s));
  if (dup) return { error: `${label}：${dup} 同時是黑子與白子` };
  // 攻殺題的目標棋子（書上以雙圓◎標示）：必須是初始盤面上的棋子
  const initSet = new Set([...ib, ...iw]);
  const targets = [...new Set((Array.isArray(raw.targets) ? raw.targets : []).map(s => norm(s)).filter(s => s && initSet.has(s)))];

  return {
    problem: {
      id: String(raw.id ?? `P-${Date.now().toString(36)}-${idx}`),
      group: String(raw.group ?? raw.book ?? '').trim(),
      category: String(raw.category || '未分類'),
      title: String(raw.title || raw.id || '未命名題目'),
      desc: String(raw.desc ?? raw.description ?? ''),
      boardSize: BOARD,
      initialBlack: [...new Set(ib)],
      initialWhite: [...new Set(iw)],
      solution,
      targets,
      updatedAt: Number.isFinite(+raw.updatedAt) ? +raw.updatedAt : 0,
    }
  };
}
function clampInt(v, lo, hi, d) { v = parseInt(v, 10); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; }
/** 檢查題目是否能照正解下完；回傳錯誤訊息或 null（結果快取在題目物件上，題目內容改變時會換成新物件） */
const issueCache = new WeakMap();
function problemIssue(p) {
  if (issueCache.has(p)) return issueCache.get(p);
  const r = problemIssue0(p);
  issueCache.set(p, r);
  return r;
}
function problemIssue0(p) {
  const pos = computePosition(p, []);
  for (let i = 0; i < pos.grid.length; i++) {
    if (pos.grid[i] && groupAt(pos.grid, pos.size, i).libs === 0)
      return `初始盤面的 ${toCoord(i % pos.size, Math.floor(i / pos.size), pos.size)} 沒有氣`;
  }
  const full = computePosition(p, p.solution);
  if (full.illegal >= 0) return `正解第 ${full.illegal + 1} 手 ${p.solution[full.illegal].coord}：${full.reason}`;
  return null;
}

/* =========================================================
   題庫儲存
   ========================================================= */
const DEFAULT_PROBLEMS = [
  { id: '範例-1', group: '範例', category: '入門', title: '提子', desc: '黑先。白二子只剩一口氣，把它吃掉。',
    boardSize: 9, initialBlack: ['A2', 'B2', 'C2'], initialWhite: ['A1', 'B1'],
    solution: [{ coord: 'C1', color: 'B', note: '黑 1 提掉白二子。' }] },
  { id: '範例-2', group: '範例', category: '入門', title: '點殺直三', desc: '白先殺。黑棋的眼位是一線直三。',
    boardSize: 9, initialBlack: ['A2', 'B2', 'C2', 'D2', 'D1'], initialWhite: ['A3', 'B3', 'C3', 'D3', 'E2', 'E1'],
    solution: [{ coord: 'B1', color: 'W', note: '白 1 點在直三中央，黑棋做不出兩隻眼。' }] }
];

let deckPristine = false;   // true＝這台裝置還沒有任何自己的資料（只有內建範例）
let deck = loadDeck();
function loadDeck() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  for (const k of OLD_STORE_KEYS) { if (!Array.isArray(raw)) { try { raw = JSON.parse(localStorage.getItem(k)); } catch (e) {} } }
  if (!Array.isArray(raw) || raw.length === 0) { raw = DEFAULT_PROBLEMS; deckPristine = true; }
  const out = raw.map((r, i) => normalizeProblem(r, i).problem).filter(Boolean);
  return out.length ? out : DEFAULT_PROBLEMS.map((r, i) => normalizeProblem(r, i).problem);
}
let saveTimer = null;
function saveDeck() {   // 題庫很大時，存檔很花時間：合併成稍後一次寫入
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDeckNow, 400);
}
function saveDeckNow() {
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(deck)); }
  catch (e) { toast('儲存空間不足，請匯出備份後清除部分作答紀錄'); }
}
window.addEventListener('pagehide', () => { if (saveTimer) saveDeckNow(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) saveDeckNow(); });
const UNGROUPED = '未分組';
const groupOf = p => p.group || UNGROUPED;
const groups = () => [...new Set(deck.map(groupOf))];
const categories = (g = 'ALL') => { const set = new Set(); for (const p of deck) if (g === 'ALL' || groupOf(p) === g) set.add(p.category); return [...set]; };
const catLabel = p => (p.group ? `${p.group} · ${p.category}` : p.category);
const findProblem = id => deck.find(p => p.id === id);

/* =========================================================
   棋盤繪製（練習、製題、縮圖共用）
   ========================================================= */
/* 19 路星位中落在可見範圍的：D4、K4 */
const STARS = [[3, 15], [9, 15]];
/** 視窗幾何：左、下是邊線（留座標空間），上、右是開放的（線條延伸出去） */
function geometry(w, h, labels) {
  const mL = labels ? 1.0 : 0.55, mB = labels ? 1.0 : 0.55, open = 0.65;
  const cell = Math.min(w / (VIEW_COLS - 1 + mL + open), h / (VIEW_ROWS - 1 + mB + open));
  const bw = cell * (VIEW_COLS - 1 + mL + open), bh = cell * (VIEW_ROWS - 1 + mB + open);
  return { cell, mL, mB, open, ox: (w - bw) / 2 + mL * cell, oy: (h - bh) / 2 + open * cell };
}
function fitCanvas(cv, cssW, cssH) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(cssW || cv.clientWidth), h = Math.round(cssH || cv.clientHeight);
  if (!w || !h) return null;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w, h };
}
/**
 * view = { size(19), grid, nums, ghosts:[{i,color,n}], marks:[{i,type}] }
 * opts = { labels, w, h }
 */
function drawBoard(cv, view, opts = {}) {
  const dim = fitCanvas(cv, opts.w, opts.h);
  if (!dim) return;
  const ctx = cv.getContext('2d'), size = view.size, labels = opts.labels !== false;
  const { cell, ox, oy, open, mB, mL } = geometry(dim.w, dim.h, labels);
  const xy = i => [ox + (i % size) * cell, oy + (Math.floor(i / size) - VIEW_TOP) * cell];
  const right = ox + (VIEW_COLS - 1) * cell, bottom = oy + (VIEW_ROWS - 1) * cell;

  ctx.fillStyle = '#dcb46c';
  ctx.fillRect(0, 0, dim.w, dim.h);
  ctx.strokeStyle = '#4a3420';
  ctx.lineWidth = Math.max(0.6, cell / 40);
  ctx.beginPath();
  for (let k = 0; k < VIEW_ROWS; k++) { ctx.moveTo(ox, oy + k * cell); ctx.lineTo(right + open * cell, oy + k * cell); }
  for (let k = 0; k < VIEW_COLS; k++) { ctx.moveTo(ox + k * cell, oy - open * cell); ctx.lineTo(ox + k * cell, bottom); }
  ctx.stroke();
  // 邊線（左、下）加粗
  ctx.lineWidth = Math.max(1.2, cell / 18);
  ctx.beginPath();
  ctx.moveTo(ox, oy - open * cell); ctx.lineTo(ox, bottom); ctx.lineTo(right + open * cell, bottom);
  ctx.stroke();
  ctx.fillStyle = '#4a3420';
  STARS.forEach(([c, r]) => { ctx.beginPath(); ctx.arc(ox + c * cell, oy + (r - VIEW_TOP) * cell, Math.max(1.5, cell / 12), 0, 7); ctx.fill(); });

  if (labels) {
    ctx.fillStyle = '#5b4026';
    ctx.font = `${Math.round(cell * 0.34)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let k = 0; k < VIEW_COLS; k++) ctx.fillText(LETTERS[k], ox + k * cell, bottom + mB * cell * 0.62);
    for (let k = 0; k < VIEW_ROWS; k++) ctx.fillText(String(VIEW_ROWS - k), ox - mL * cell * 0.62, oy + k * cell);
  }

  const stone = (i, color, n, alpha) => {
    const [x, y] = xy(i), rad = cell * 0.47;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (alpha === 1 && cell > 20) { ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = cell / 10; ctx.shadowOffsetY = cell / 30; }
    const g = ctx.createRadialGradient(x - rad * .35, y - rad * .35, rad * .1, x, y, rad);
    if (color === 'B') { g.addColorStop(0, '#5a5a5a'); g.addColorStop(1, '#111'); }
    else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#d6d6d0'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill();
    ctx.restore();
    if (n && cell > 14) {
      ctx.save();
      ctx.globalAlpha = alpha === 1 ? 1 : 0.7;
      ctx.fillStyle = color === 'B' ? '#fff' : '#111';
      ctx.font = `600 ${Math.round(cell * (n > 9 ? 0.4 : 0.48))}px -apple-system, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(n), x, y + cell * 0.02);
      ctx.restore();
    }
  };
  const visible = i => inView(i % size, Math.floor(i / size));
  view.grid.forEach((col, i) => { if (col && visible(i)) stone(i, col, view.nums?.get(i), 1); });
  // 目標棋子：在棋子內畫一圈（雙圓◎）；被提掉後就不再顯示
  (view.targets || []).forEach(i => {
    const col = view.grid[i];
    if (!col || !visible(i) || view.nums?.get(i)) return;
    const [x, y] = xy(i);
    ctx.save();
    ctx.strokeStyle = col === 'B' ? '#fff' : '#111';
    ctx.lineWidth = Math.max(1.2, cell / 16);
    ctx.beginPath(); ctx.arc(x, y, cell * 0.27, 0, 7); ctx.stroke();
    ctx.restore();
  });
  (view.ghosts || []).forEach(g => { if (!view.grid[g.i] && visible(g.i)) stone(g.i, g.color, g.n, 0.38); });

  (view.marks || []).forEach(m => {
    if (!visible(m.i)) return;
    const [x, y] = xy(m.i);
    ctx.save();
    ctx.lineWidth = Math.max(2, cell / 12);
    if (m.type === 'error') { ctx.strokeStyle = '#d93025'; ctx.beginPath(); ctx.arc(x, y, cell * 0.5, 0, 7); ctx.stroke(); }
    if (m.type === 'correct') {
      ctx.fillStyle = 'rgba(46,125,79,.25)'; ctx.strokeStyle = '#2e7d4f';
      ctx.beginPath(); ctx.arc(x, y, cell * 0.42, 0, 7); ctx.fill(); ctx.stroke();
    }
    if (m.type === 'hint') {
      ctx.strokeStyle = '#22577a'; ctx.setLineDash([cell / 8, cell / 10]);
      ctx.beginPath(); ctx.arc(x, y, cell * 0.42, 0, 7); ctx.stroke();
    }
    ctx.restore();
  });
}
function hitTest(cv, ev) {
  const rect = cv.getBoundingClientRect();
  const { cell, ox, oy } = geometry(rect.width, rect.height, true);
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  const c = Math.round((px - ox) / cell), vr = Math.round((py - oy) / cell);
  if (c < 0 || c >= VIEW_COLS || vr < 0 || vr >= VIEW_ROWS) return null;
  // 點太遠就不算（避免誤觸棋盤邊緣）
  if (Math.hypot(px - (ox + c * cell), py - (oy + vr * cell)) > cell * 0.6) return null;
  return { c, r: vr + VIEW_TOP };
}
/** 綁定棋盤點擊：用 pointer 事件，手指拖曳太遠視為取消 */
function bindBoardTap(cv, handler) {
  let start = null;
  cv.addEventListener('pointerdown', e => { start = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('pointerup', e => {
    if (!start) return;
    const moved = Math.hypot(e.clientX - start.x, e.clientY - start.y);
    start = null;
    if (moved < 20) handler(e);
  });
  cv.addEventListener('pointercancel', () => { start = null; });
  // iPad Safari：快速連點會觸發「點兩下放大」，CSS 的 touch-action 不一定擋得住，
  // 所以直接取消棋盤上觸控事件的預設行為（落子用的是上面的 pointer 事件，不受影響）
  const block = e => { if (e.cancelable) e.preventDefault(); };
  cv.addEventListener('touchstart', block, { passive: false });
  cv.addEventListener('touchend', block, { passive: false });
  cv.addEventListener('dblclick', block);
}
// 棋盤以外的地方也避免雙指縮放手勢誤觸（iOS 專用事件）
document.addEventListener('gesturestart', e => { if (e.target.closest && e.target.closest('.board-wrap')) e.preventDefault(); });

const S = {
  tab: 'play',
  mode: 'AUTO',        // AUTO 自動應答 / FREE 自由擺子
  group: 'ALL',        // 大類篩選
  cat: 'ALL',          // 子類篩選
  current: deck[0].id,
};
let play = null;
const curProblem = () => findProblem(S.current) || deck[0];
const isAdmin = () => auth.user?.role === 'admin';

function newRound(clock) {
  play = { moves: [], state: 'playing', errorIdx: -1, correct: null, recorded: false, busy: false, timer: null,
           clock: clock || { elapsed: 0, since: Date.now() } };
}
/** 開始一題。同一題還沒對完答案就按「重來」、切換模式或同步重畫時，計時不歸零 */
function startProblem(id) {
  if (play?.timer) clearTimeout(play.timer);
  const sameId = play && (!id || id === S.current);
  const sameRound = sameId && !play.recorded;
  if (id) S.current = id;
  newRound(sameRound ? play.clock : null);
  if (!sameId) noteServed(S.current);
  renderPlay();
}

/* ---------- 計時：題目一出現就開始，對完答案就停止；App 切到背景時暫停 ---------- */
const clockMs = c => c.elapsed + (c.since ? Date.now() - c.since : 0);
function stopClock() { const c = play.clock; if (c.since) { c.elapsed += Date.now() - c.since; c.since = null; } return c.elapsed; }
function fmtTime(ms) {
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = t % 60, z = n => String(n).padStart(2, '0');
  return h ? `${h}:${z(m)}:${z(sec)}` : `${m}:${z(sec)}`;
}
function renderTimer() {
  if (!play) return;
  const el = $('pTimer');
  el.textContent = '⏱ ' + fmtTime(clockMs(play.clock));
  el.className = 'timer' + (play.state === 'success' ? ' done' : play.state === 'fail' ? ' fail' : '');
}
setInterval(() => { if (play && play.clock.since && S.tab === 'play') renderTimer(); }, 250);
document.addEventListener('visibilitychange', () => {
  if (!play || play.state !== 'playing') return;
  const c = play.clock;
  if (document.visibilityState === 'hidden') { if (c.since) { c.elapsed += Date.now() - c.since; c.since = null; } }
  else if (!c.since) c.since = Date.now();
});

function userColor(p) { return p.solution[0].color; }

function playView() {
  const p = curProblem();
  let moves = play.moves, ghosts = [];
  if (S.mode === 'FREE' && play.errorIdx >= 0) {
    moves = play.moves.slice(0, play.errorIdx + 1);
    const pre = computePosition(p, moves);
    ghosts = play.moves.slice(play.errorIdx + 1).map((m, k) => {
      const q = parseCoord(m.coord, p.boardSize);
      return { i: q.r * p.boardSize + q.c, color: m.color, n: play.errorIdx + 2 + k };
    });
    return withMarks(pre, ghosts, p);
  }
  return withMarks(computePosition(p, moves), ghosts, p);
}
function withMarks(pos, ghosts, p) {
  const size = p.boardSize, marks = [];
  const idx = s => { const q = parseCoord(s, size); return q.r * size + q.c; };
  if (play.errorIdx >= 0) marks.push({ i: idx(play.moves[play.errorIdx].coord), type: 'error' });
  if (play.correct) marks.push({ i: idx(play.correct), type: 'correct' });
  return { size, grid: pos.grid, nums: pos.nums, ghosts, marks, targets: targetIdx(p) };
}

function renderPlay() {
  const p = curProblem();
  $('pCat').textContent = catLabel(p);
  $('pId').textContent = p.id;
  $('pTitle').textContent = p.title;
  $('pDesc').textContent = p.desc;
  $('pDesc').classList.toggle('hidden', !p.desc);
  const issue = problemIssue(p);
  $('pWarn').classList.toggle('hidden', !issue);
  $('pWarn').title = issue || '';

  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
  $('btnUndo').classList.toggle('hidden', S.mode !== 'FREE');
  $('btnCheck').classList.toggle('hidden', S.mode !== 'FREE');
  $('btnUndo').disabled = play.state !== 'playing' || play.moves.length === 0;
  $('btnCheck').disabled = play.state !== 'playing' || play.moves.length === 0;

  renderStatus();
  renderFilterSelects();
  renderMastery();
  renderHistory();
  renderTimer();
  drawBoard($('playBoard'), playView());
}

function renderStatus() {
  const p = curProblem(), uc = userColor(p), el = $('pStatus');
  let tone = '', t = '', d = '';
  const issue = problemIssue(p);
  if (issue) { tone = 'warn'; t = '這題的資料有問題'; d = issue + '。可到「題庫」按編輯修正。'; }
  else if (play.msg) { ({ tone, t, d } = play.msg); }
  else if (S.mode === 'AUTO') {
    t = `${colorName(uc)}先`;
    d = p.targets.length ? `你執${colorName(uc)}，目標是吃掉 ◎ 標示的棋子。` : `你執${colorName(uc)}，電腦會照正解應對。`;
  }
  else {
    const n = play.moves.length, c = n % 2 === 0 ? uc : other(uc);
    t = `輪到${colorName(c)}（第 ${n + 1} 手）`; d = '自行擺出雙方手順，擺完按「對答案」。';
  }
  el.className = 'status ' + tone;
  el.querySelector('b').textContent = t;
  el.querySelector('span').textContent = d;
}
function setMsg(tone, t, d) { play.msg = { tone, t, d }; }

function onPlayTap(e) {
  const p = curProblem();
  const q = hitTest($('playBoard'), e);
  if (!q || play.state !== 'playing' || play.busy) return;
  if (problemIssue(p)) { toast('這題的資料有問題，請先到題庫修正'); return; }
  const coord = toCoord(q.c, q.r, p.boardSize);
  const n = play.moves.length;
  const uc = userColor(p);
  const color = S.mode === 'AUTO' ? p.solution[n].color : (n % 2 === 0 ? uc : other(uc));

  // 合法性檢查
  const trial = computePosition(p, [...play.moves, { coord, color }]);
  if (trial.illegal >= 0) { if (trial.reason !== '此處已有棋子') toast(trial.reason); return; }

  if (S.mode === 'FREE') {
    play.moves.push({ coord, color });
    play.msg = null;
    renderPlay();
    return;
  }

  // 自動應答
  const expect = p.solution[n];
  play.moves.push({ coord, color });
  if (coord !== expect.coord) {
    play.state = 'fail'; play.errorIdx = n;
    setMsg('bad', '不是正解', `第 ${n + 1} 手 ${coord} 不對。按「重來」再試一次，或按「下一題」。`);
    finishRound(false, `第 ${n + 1} 手錯（${coord}）`);
    renderPlay();
    return;
  }
  setMsg('', '正確！', expect.note || '');
  autoReply();
}
function autoReply() {
  const p = curProblem();
  const idx = play.moves.length;
  if (idx >= p.solution.length) {
    play.state = 'success';
    finishRound(true, '正解');
    setMsg('good', '正解！', `全部手順正確，用時 ${fmtTime(play.ms)}。`);
    renderPlay();
    return;
  }
  const next = p.solution[idx];
  if (next.color === userColor(p)) { renderPlay(); return; }
  play.busy = true;
  renderPlay();
  play.timer = setTimeout(() => {
    play.busy = false;
    play.moves.push({ coord: next.coord, color: next.color });
    if (next.note) setMsg('', `${colorName(next.color)}應 ${next.coord}`, next.note);
    else setMsg('', `${colorName(next.color)}應 ${next.coord}`, `輪到你繼續（第 ${idx + 2} 手）。`);
    autoReply();
  }, 350);
}

function checkFree() {
  const p = curProblem(), sol = p.solution, mv = play.moves;
  let err = -1;
  for (let i = 0; i < mv.length; i++) {
    if (i >= sol.length || mv[i].coord !== sol[i].coord || mv[i].color !== sol[i].color) { err = i; break; }
  }
  if (err === -1 && mv.length >= sol.length) {
    play.state = 'success';
    finishRound(true, '正解');
    setMsg('good', '正解！', `全部手順正確，用時 ${fmtTime(play.ms)}。`);
  } else if (err === -1) {
    setMsg('warn', '目前都正確', `已完成 ${mv.length} / ${sol.length} 手，請繼續往下擺。`);
  } else {
    play.state = 'fail'; play.errorIdx = err;
    setMsg('bad', `第 ${err + 1} 手錯了`,
      err < sol.length ? `紅圈是錯的那一手，之後的手順以淡色保留供檢討。按「重來」再想想。` : `正解只有 ${sol.length} 手，第 ${err + 1} 手之後是多餘的。`);
    finishRound(false, `第 ${err + 1} 手錯`);
  }
  renderPlay();
}
function undoFree() {
  if (play.state !== 'playing' || !play.moves.length) return;
  play.moves.pop(); play.msg = null;
  renderPlay();
}
function finishRound(ok, text) {
  if (play.recorded) return;
  play.recorded = true;
  play.ms = stopClock();
  const p = curProblem(), g = progW(p.id), t = Date.now();
  g.history.unshift({ t, ok, mode: S.mode, text, ms: play.ms, moves: play.moves.map(m => ({ ...m })), err: play.errorIdx });
  if (g.history.length > HIST_KEEP) g.history.length = HIST_KEEP;
  g.log.push({ t, ok: ok ? 1 : 0, ms: play.ms });
  if (g.log.length > LOG_KEEP) g.log = g.log.slice(-LOG_KEEP);
  g.n += 1; g.ms += play.ms; g.last = t;
  if (ok) {
    noteSolved(p.id);
    g.ok += 1;
    g.level = Math.min(5, g.level + 1);
    g.streak += 1; g.penalty = 0;
  } else {
    g.level = Math.max(0, g.level - 1); g.streak = 0; g.penalty = 50;
  }
  touchProg(p.id);
}

function renderMastery() {
  const g = prog(curProblem().id);
  $('pDots').innerHTML = Array.from({ length: 5 }, (_, k) => `<i class="${k < g.level ? 'on' : ''}"></i>`).join('');
  const times = g.log.filter(h => h.ok && h.ms > 0).map(h => h.ms);
  $('pStreak').textContent = [g.streak ? `連續答對 ${g.streak} 次` : '', times.length ? `最快 ${fmtTime(Math.min(...times))}` : ''].filter(Boolean).join('・');
}

function fmtDate(h) {
  if (!h.t) return h.dateText || '';
  const d = new Date(h.t), z = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`;
}
function historyView(p, h) {
  if (!h.moves) return null;
  const errIdx = h.mode === 'FREE' ? h.err : -1;
  const moves = errIdx >= 0 ? h.moves.slice(0, errIdx + 1) : h.moves;
  const pos = computePosition(p, moves);
  const size = p.boardSize, idx = s => { const q = parseCoord(s, size); return q ? q.r * size + q.c : -1; };
  const ghosts = errIdx >= 0 ? h.moves.slice(errIdx + 1).map((m, k) => ({ i: idx(m.coord), color: m.color, n: errIdx + 2 + k })).filter(g => g.i >= 0) : [];
  const marks = [];
  if (h.err >= 0 && h.moves[h.err]) marks.push({ i: idx(h.moves[h.err].coord), type: 'error' });
  return { size, grid: pos.grid, nums: pos.nums, ghosts, marks: marks.filter(m => m.i >= 0), targets: targetIdx(p) };
}
function renderHistory() {
  const p = curProblem(), box = $('histList'), hist = prog(p.id).history;
  box.innerHTML = '';
  if (!hist.length) { box.innerHTML = '<div class="empty">還沒有紀錄，完成一次作答後會出現在這裡。</div>'; return; }
  hist.forEach((h, k) => {
    const row = document.createElement('div');
    row.className = 'hist-item';
    let thumb;
    if (h.moves) { thumb = document.createElement('canvas'); }
    else if (h.thumb) { thumb = document.createElement('img'); thumb.src = h.thumb; }
    else thumb = document.createElement('div');
    row.appendChild(thumb);
    const info = document.createElement('div');
    const modeText = h.mode === 'AUTO' ? '自動應答' : h.mode === 'FREE' ? '自由擺子' : h.mode;
    info.innerHTML = `<div class="r ${h.ok ? 'ok' : 'ng'}">${h.ok ? '✓' : '✗'} ${esc(h.text)}</div><div class="d">${esc(fmtDate(h))}・${esc(modeText)}${h.ms > 0 ? '・⏱ ' + fmtTime(h.ms) : ''}</div>`;
    row.appendChild(info);
    row.onclick = () => openReview(p, h);
    box.appendChild(row);
    if (h.moves) { const v = historyView(p, h); if (v) drawBoard(thumb, v, { labels: false, w: 72, h: 46 }); }
  });
}
function openReview(p, h) {
  $('reviewTitle').textContent = `${h.ok ? '✓' : '✗'} ${h.text}　${fmtDate(h)}${h.ms > 0 ? '　⏱ ' + fmtTime(h.ms) : ''}`;
  const v = historyView(p, h);
  $('reviewBoard').classList.toggle('hidden', !v);
  $('reviewImg').classList.toggle('hidden', !!v);
  $('reviewModal').classList.add('open');
  if (v) drawBoard($('reviewBoard'), v);
  else $('reviewImg').src = h.thumb || '';
}

/* ---------- 出題範圍 / 下一題 ---------- */
const pool = () => deck.filter(p => (S.group === 'ALL' || groupOf(p) === S.group) && (S.cat === 'ALL' || p.category === S.cat));
function weight(p) { const g = prog(p.id); return Math.floor(100 / (1 + 1.5 * g.level)) + g.penalty; }
function nextProblem() {
  let list = pool().filter(p => !problemIssue(p));
  if (!list.length) list = pool();
  if (list.length > 1) list = list.filter(p => p.id !== S.current);
  // 最近 10 題內答對過的先不出；範圍太小全被排除時才放寬
  const solved = new Set(recent.filter(x => x.ok).map(x => x.id));
  const fresh = list.filter(p => !solved.has(p.id));
  if (fresh.length) list = fresh;
  const total = list.reduce((s, p) => s + weight(p), 0);
  let r = Math.random() * total, pick = list[0];
  for (const p of list) { r -= weight(p); if (r <= 0) { pick = p; break; } }
  startProblem(pick.id);
}
function renderFilterSelects() {
  const gs = groups();
  if (S.group !== 'ALL' && !gs.includes(S.group)) { S.group = 'ALL'; S.cat = 'ALL'; }
  const inGroup = deck.filter(p => S.group === 'ALL' || groupOf(p) === S.group);
  const cats = categories(S.group);
  if (S.cat !== 'ALL' && !cats.includes(S.cat)) S.cat = 'ALL';
  const gCount = {}, cCount = {};
  deck.forEach(p => { gCount[groupOf(p)] = (gCount[groupOf(p)] || 0) + 1; });
  inGroup.forEach(p => { cCount[p.category] = (cCount[p.category] || 0) + 1; });
  const gHtml = `<option value="ALL">全部大類（${deck.length}）</option>` +
    gs.map(g => `<option value="${esc(g)}">${esc(g)}（${gCount[g]}）</option>`).join('');
  const cHtml = `<option value="ALL">全部子類（${inGroup.length}）</option>` +
    cats.map(c => `<option value="${esc(c)}">${esc(c)}（${cCount[c]}）</option>`).join('');
  // 內容沒變就不重建選單（每次落子都會呼叫）
  if (renderFilterSelects.last !== gHtml + cHtml + S.group + S.cat) {
    renderFilterSelects.last = gHtml + cHtml + S.group + S.cat;
    ['playGroup', 'libGroup'].forEach(id => { $(id).innerHTML = gHtml; $(id).value = S.group; });
    ['playCat', 'libCat'].forEach(id => { $(id).innerHTML = cHtml; $(id).value = S.cat; });
  }
  if (S.tab === 'edit') {
    $('groupList').innerHTML = gs.filter(g => g !== UNGROUPED).map(g => `<option value="${esc(g)}">`).join('');
    $('catList').innerHTML = categories().map(c => `<option value="${esc(c)}">`).join('');
  }
}
function onFilterChange(kind, v) {
  if (kind === 'group') { S.group = v; S.cat = 'ALL'; } else S.cat = v;
  const list = pool();
  if (list.length && !list.some(p => p.id === S.current)) startProblem(list[0].id);
  else renderPlay();
  if (S.tab === 'lib') renderLib();
  if (S.tab === 'stats') renderStats();
}

let ed = null;
function newEditor(fromProblem) {
  const p = fromProblem;
  ed = {
    origId: p ? p.id : null,
    size: BOARD,
    black: p ? [...p.initialBlack] : [],
    white: p ? [...p.initialWhite] : [],

const edProblem = () => ({ boardSize: ed.size, initialBlack: ed.black, initialWhite: ed.white, solution: ed.moves, targets: ed.targets });

function onEditTap(e) {

    const k = ed.targets.indexOf(coord);

  } else if (ed.tool === 'M') {

    if (trial.illegal >= 0) { toast(trial.reason); return; }

  } else {
    const mine = ed.tool === 'B' ? ed.black : ed.white, theirs = ed.tool === 'B' ? ed.white : ed.black;
    if (mine.includes(coord)) {
      mine.splice(mine.indexOf(coord), 1);

    } else { if (theirs.includes(coord)) theirs.splice(theirs.indexOf(coord), 1); mine.push(coord); }

/* ---------- 匯入 / 匯出 ---------- */
function runImport(text) {
  const out = $('importResult');
  let data;
  try { data = JSON.parse(text.replace(/^\uFEFF/, '')); }
  catch (err) { out.innerHTML = `<b style="color:var(--bad)">JSON 格式錯誤：</b>${esc(err.message)}`; return; }
  if (data && !Array.isArray(data)) data = Array.isArray(data.problems) ? data.problems : [data];
  if (!Array.isArray(data) || !data.length) { out.innerHTML = '<b style="color:var(--bad)">找不到任何題目</b>'; return; }

  const ok = [], errors = [];
  data.forEach((raw, i) => { const r = normalizeProblem(raw, i); r.error ? errors.push(r.error) : ok.push(r.problem); });
  if (!ok.length) { out.innerHTML = `<b style="color:var(--bad)">沒有可匯入的題目</b><ul>${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`; return; }

  const mode = document.querySelector('input[name=importMode]:checked').value;
  if (mode === 'replace' && !confirm(`要用這 ${ok.length} 題取代目前整個題庫（${deck.length} 題）嗎？不在檔案裡的題目會被刪除。`)) return;

  let added = 0, updated = 0, migrated = 0;
  if (mode === 'replace') {
    const keep = new Set(ok.map(p => p.id));
    deck.filter(p => !keep.has(p.id)).forEach(p => markDeleted(p.id));
    deck = [];
  }
  const seen = new Set();
  ok.forEach(p => {
    if (seen.has(p.id)) { errors.push(`${p.id}：檔案裡題號重複，只保留第一題`); return; }
    seen.add(p.id);
    const same = findProblem(p.id);
    // 舊版沒有大類時匯入的同一題（題號是「死活-1」）：合併進度後移除
    const legacy = p.group ? deck.find(q => q !== same && !q.group && q.category === p.category && q.id === p.title) : null;
    if (legacy) { deck = deck.filter(q => q !== legacy); markDeleted(legacy.id); migrated++; }
    if (same) { deck[deck.indexOf(same)] = p; updated++; }
    else if (legacy) { deck.push(p); updated++; }
    else { deck.push(p); added++; }
    touch(p);
  });
  saveDeck();
  const warn = ok.filter(p => problemIssue(p));
  S.group = 'ALL'; S.cat = 'ALL';
  if (!findProblem(S.current)) S.current = deck[0].id;
  startProblem();
  renderLib();
  out.innerHTML = `<b style="color:var(--good)">匯入完成：新增 ${added} 題、更新 ${updated} 題</b>` +
    (migrated ? `<div style="margin-top:6px">其中 ${migrated} 題是舊版沒有大類的同一題，已改用新題號。</div>` : '') +
    (warn.length ? `<div style="margin-top:6px">其中 ${warn.length} 題的正解無法照規則下完，已標示「資料有誤」：</div><ul>${warn.map(p => `<li>${esc(p.id)}：${esc(problemIssue(p))}</li>`).join('')}</ul>` : '') +
    (errors.length ? `<div style="margin-top:6px">略過 ${errors.length} 筆：</div><ul>${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : '');
  $('importText').value = '';
}
function exportDeck() {
  const data = deck.map(p => ({
    id: p.id, group: p.group, category: p.category, title: p.title, desc: p.desc, boardSize: p.boardSize,
    initialBlack: p.initialBlack, initialWhite: p.initialWhite, solution: p.solution, targets: p.targets
  }));
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = `tsumego_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}.json`;
  const json = JSON.stringify(data, null, 2);
  const file = new File([json], name, { type: 'application/json' });
  const touch = matchMedia('(pointer: coarse)').matches;

  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();

/* =========================================================

// 舊版的共用同步密碼已不再使用

/* =========================================================
   作答紀錄：每個使用者、每題一筆

const HIST_KEEP = 20, LOG_KEEP = 300;

  try { const v = JSON.parse(localStorage.getItem(progKey())); if (v && v.map) return { map: v.map, pending: v.pending || {}, since: v.since || 0 }; } catch (e) {}
  return { map: {}, pending: {}, since: 0 };
}
let progTimer = null;
function saveProg() { clearTimeout(progTimer); progTimer = setTimeout(saveProgNow, 400); }
function saveProgNow() {
  clearTimeout(progTimer); progTimer = null;
  try { localStorage.setItem(progKey(), JSON.stringify(progStore)); } catch (e) { toast('儲存空間不足，請清除部分作答紀錄'); }
}
window.addEventListener('pagehide', () => { if (progTimer) saveProgNow(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && progTimer) saveProgNow(); });

function progW(id) {
  let g = progStore.map[id];
  if (!g) g = progStore.map[id] = { ...EMPTY_PROG, log: [], history: [] };
  return g;
}

    n: num(d.n), ok: num(d.ok), ms: num(d.ms), last: num(d.last),
    log: Array.isArray(d.log) ? d.log.filter(x => x && x.t) : [],

    updatedAt: num(d.updatedAt),

/* ---------- 最近出過的題目：答對的題目在之後 10 題內不再出現 ---------- */
const RECENT_N = 10;
const recentKey = () => 'tsumego_recent_v2_' + (auth.user ? auth.user.id : 'none');

/* =========================================================
   雲端同步（Cloudflare Workers + D1）
   - 題目：所有人下載；只有管理者能上傳變更
   - 作答紀錄：每人只同步自己的
   - 所有變更先存本機，再排入待上傳佇列，有網路時自動上傳；以 updatedAt 較新的一方為準
   ========================================================= */
const PENDING_KEY = 'tsumego_pending_v2';       // 題目的待上傳變更（管理者）
const SYNC_TS_KEY = 'tsumego_sync_ts_v2';       // 上次同步題目時的伺服器時間
const SYNC_CHUNK = 60, PROG_CHUNK = 100;
let pending = (() => {
  try { const v = JSON.parse(localStorage.getItem(PENDING_KEY)); if (v && v.up && v.del) return v; } catch (e) {}
  return { up: {}, del: {} };
})();
const sync = { state: LOCAL_MODE ? 'local' : 'idle', busy: false, again: false, timer: null, last: 0,
  since: (() => { try { return Number(localStorage.getItem(SYNC_TS_KEY)) || 0; } catch (e) { return 0; } })() };
function setSince(v) { sync.since = v; try { localStorage.setItem(SYNC_TS_KEY, String(v)); } catch (e) {} }

function savePending() { try { localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); } catch (e) {} }
function touch(p) {
  p.updatedAt = Math.max(Date.now(), (p.updatedAt || 0) + 1);
  if (!isAdmin()) return;
  pending.up[p.id] = p.updatedAt;
  delete pending.del[p.id];
  deckPristine = false;
  savePending();
  scheduleSync();
}
function markDeleted(id) {
  if (!isAdmin()) return;
  delete pending.up[id];
  pending.del[id] = Date.now();
  deckPristine = false;
  savePending();
  scheduleSync();
}
/** 一次刪除多題（只寫一次 localStorage、排一次同步） */
function deleteProblems(ids) {
  const set = new Set(ids), now = Date.now();
  deck = deck.filter(p => !set.has(p.id));
  if (isAdmin()) ids.forEach(id => { delete pending.up[id]; pending.del[id] = now; });
  deckPristine = false;
  savePending(); saveDeck(); scheduleSync();
}
/**
 * 清理舊版重複題（只有管理者會執行）：沒有大類的題目，若有「同子類、且名稱等於它題號」的有大類版本
 * （例：舊的「死活-1」對上「階三-死活-1」），就刪除舊的。
 */
function cleanupLegacy() {
  if (!isAdmin()) return 0;
  const byKey = new Map();
  deck.forEach(q => { if (q.group) byKey.set(q.category + '|' + q.title, q); });
  if (!byKey.size) return 0;
  const gone = deck.filter(p => !p.group && byKey.has(p.category + '|' + p.id)).map(p => p.id);
  if (gone.length) deleteProblems(gone);
  return gone.length;
}
function scheduleSync(delay = 1500) {

  clearTimeout(sync.timer);
  sync.timer = setTimeout(runSync, delay);
}
function serializeProblem(p) {
  return {
    id: p.id, group: p.group, category: p.category, title: p.title, desc: p.desc, boardSize: p.boardSize,
    initialBlack: p.initialBlack, initialWhite: p.initialWhite, solution: p.solution, targets: p.targets, updatedAt: p.updatedAt,

}
async function api(method, path, body, noAuth) {

      method, credentials: 'same-origin', redirect: 'manual', cache: 'no-store',
      headers: Object.assign(body ? { 'Content-Type': 'application/json' } : {}, !noAuth && auth.token ? { Authorization: 'Bearer ' + auth.token } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw { kind: 'offline', message: '連不上伺服器' }; }
  if (res.type === 'opaqueredirect' || (res.status >= 300 && res.status < 400)) throw { kind: 'error', message: '伺服器回應異常' };
  let data = null;
  try { data = await res.json(); } catch (e) { throw { kind: 'error', message: '伺服器回應不是 API（HTTP ' + res.status + '）' }; }
  if (res.status === 401) throw { kind: data?.error === 'not_configured' ? 'setup' : 'login', code: data?.error, message: data?.message };
  if (!res.ok) throw { kind: 'error', code: data?.error, message: data?.message || ('HTTP ' + res.status) };
  return data;
}

  sync.busy = true;
  setSyncState('busy');
  try {
    await syncDeck();
    await syncProgress();
    sync.last = Date.now();
    const left = Object.keys(pending.up).length + Object.keys(pending.del).length + Object.keys(progStore.pending).length;
    setSyncState(left ? 'busy' : 'ok');
  } catch (e) {
    setSyncState(e.kind || 'error', e.message);
    if (e.kind === 'login') logout(e.message || '登入已失效，請重新登入');
  } finally {
    sync.busy = false;
    if (sync.again || (sync.state === 'busy')) { sync.again = false; scheduleSync(300); }
  }
}
async function syncDeck() {
  if (!isAdmin()) { pending.up = {}; pending.del = {}; }
  Object.keys(pending.up).forEach(id => { if (!findProblem(id)) delete pending.up[id]; });
  const ups = Object.keys(pending.up).map(findProblem).map(serializeProblem);
  const dels = Object.entries(pending.del).map(([id, deletedAt]) => ({ id, deletedAt }));
  const full = !sync.since;
  const got = new Map();   // 伺服器回傳的變動（同一題以最後一次為準）
  let now = null;
  const take = res => { (res.problems || []).forEach(r => got.set(r.id, r)); if (res.now) now = res.now; };
  if (!ups.length && !dels.length) {
    take(await api('GET', 'deck?since=' + sync.since));
  } else {
    for (let k = 0; k < ups.length + dels.length; k += SYNC_CHUNK) {
      const probs = ups.slice(k, k + SYNC_CHUNK);
      const ds = dels.slice(Math.max(0, k - ups.length), Math.max(0, k + SYNC_CHUNK - ups.length));
      take(await api('POST', 'sync', { problems: probs, deletes: ds, since: k === 0 ? sync.since : (now || sync.since) }));
      probs.forEach(p => { if (pending.up[p.id] === p.updatedAt) delete pending.up[p.id]; });
      ds.forEach(d => { if (pending.del[d.id] === d.deletedAt) delete pending.del[d.id]; });
      savePending();
    }
  }
  mergeServer([...got.values()], full);
  if (now) setSince(now);
}
async function syncProgress() {
  const ids = Object.keys(progStore.pending);
  const got = [];
  let now = null;
  if (!ids.length) {
    const r = await api('GET', 'progress?since=' + progStore.since);
    got.push(...r.items); now = r.now;
  } else {
    for (let k = 0; k < ids.length; k += PROG_CHUNK) {
      const items = ids.slice(k, k + PROG_CHUNK).map(id => ({ problemId: id, updatedAt: progStore.map[id]?.updatedAt || progStore.pending[id], data: progStore.map[id] }))
        .filter(it => it.data);
      const r = await api('POST', 'progress', { items, since: k === 0 ? progStore.since : (now || progStore.since) });
      got.push(...r.items); now = r.now;
      items.forEach(it => { if (progStore.pending[it.problemId] === it.updatedAt) delete progStore.pending[it.problemId]; });
    }
    ids.forEach(id => { if (!progStore.map[id]) delete progStore.pending[id]; });
  }
  let changed = false;
  for (const it of got) {
    const local = progStore.map[it.problemId];
    if (local && (local.updatedAt || 0) >= it.updatedAt) continue;
    let d = null;
    try { d = cleanProg(JSON.parse(it.data)); } catch (e) {}
    if (!d) continue;
    d.updatedAt = it.updatedAt;
    progStore.map[it.problemId] = d;
    delete progStore.pending[it.problemId];
    changed = true;
  }
  if (now) progStore.since = now;
  saveProgNow();
  if (changed) {
    if (S.tab === 'play' && play) { renderMastery(); renderHistory(); }
    if (S.tab === 'stats') renderStats();
    if (S.tab === 'lib') { renderLib.key = null; renderLib(); }
  }
}
function mergeServer(rows, full) {
  const onServer = new Set();
  let changed = false;
  const admin = isAdmin();
  const live = rows.filter(r => !r.deleted);
  // 新裝置（只有內建範例）而雲端已有題庫：直接採用雲端，不上傳範例。使用者一律以雲端為準。
  const adoptServer = full && (!admin || (deckPristine && live.length > 0));
  for (const r of rows) {
    onServer.add(r.id);
    const local = findProblem(r.id);
    if (r.deleted) {
      if (local && !pending.up[r.id] && (!admin || (local.updatedAt || 0) <= r.updatedAt)) { deck = deck.filter(p => p !== local); changed = true; }
      continue;
    }
    if (local && pending.up[r.id] && (local.updatedAt || 0) >= r.updatedAt) continue;
    if (!local || (admin ? (local.updatedAt || 0) < r.updatedAt : (local.updatedAt || 0) !== r.updatedAt)) {
      const n = normalizeProblem(r.data, 0).problem;
      if (!n) continue;
      n.updatedAt = r.updatedAt;
      if (local) deck[deck.indexOf(local)] = n; else deck.push(n);
      changed = true;
    }
  }
  // 本機有、雲端沒有的題目（只有完整同步時才知道雲端有哪些）
  let needPush = false;
  if (full) for (const p of [...deck]) {
    if (onServer.has(p.id) || pending.up[p.id]) continue;
    if (adoptServer) { deck = deck.filter(x => x !== p); changed = true; continue; }
    p.updatedAt = p.updatedAt || Date.now();
    pending.up[p.id] = p.updatedAt; needPush = true;
  }
  if (adoptServer) deckPristine = false;
  if (!deck.length) {   // 雲端沒有任何題目：放回範例，避免畫面沒有題目（管理者會上傳範例）
    deck = DEFAULT_PROBLEMS.map((r, i) => normalizeProblem(r, i).problem);
    deck.forEach(p => { p.updatedAt = Date.now(); if (admin) pending.up[p.id] = p.updatedAt; });
    needPush = admin; changed = true;
  }
  if (needPush) { savePending(); scheduleSync(300); }
  if (changed) cleanupLegacy();
  if (changed) {
    renderLib.key = null;
    saveDeck();
    if (!findProblem(S.current)) startProblem(deck[0].id);
    else if (S.tab === 'play' && play.state === 'playing' && !play.moves.length) startProblem();
    else if (S.tab === 'play') renderPlay();
    if (S.tab === 'lib') renderLib();
    if (S.tab === 'stats') renderStats();
    renderFilterSelects();
  }
}

const DAY = 86400000;
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

async function renderStats() {

  if (seq !== statsSeq) return;
  $('statMsg').classList.add('hidden');
  const list = pool(), viewingSelf = statsView.uid == null || statsView.uid === auth.user.id;

  // ---- 數字 ----

  list.forEach(p => {

  });

  $('statTiles').innerHTML =

    tile('平均用時', n ? fmtTime(ms / n) : '—', okTimes.length ? `答對時平均 ${fmtTime(okTimes.reduce((a, b) => a + b, 0) / okTimes.length)}` : '每次作答') +

    tile('最後練習', last ? fmtDate({ t: last }).split(' ')[0] : '—', last ? fmtDate({ t: last }).split(' ')[1] : '');

  // ---- 近 30 天 ----

  drawChart($('chAcc'), { type: 'line', labels, values: days.map(d => (d.n ? d.ok / d.n * 100 : null)), fmt: v => Math.round(v) + '%', max: 100, yfmt: v => v + '%' });
  drawChart($('chTime'), { type: 'line', labels, values: days.map(d => (d.n ? d.ms / d.n : null)), fmt: fmtTime, yfmt: fmtTime });

  // ---- 熟悉度方塊圖（依大類・子類分組） ----

      return `<i class="${cls}" data-id="${esc(p.id)}" title="${esc(tip)}"></i>`;
    }).join('') + '</div>';
  }).join('') : '<div class="empty">這個範圍沒有題目</div>';
  $('heat').dataset.self = viewingSelf ? '1' : '';
  statsView.map = map;
}

  renderStats();
});

/* ---------- 簡單圖表（單一數列；點一下或滑過顯示數值） ---------- */
function drawChart(cv, o) {
  const dim = fitCanvas(cv);
  if (!dim) return;
  const ctx = cv.getContext('2d'), { w, h } = dim;
  ctx.clearRect(0, 0, w, h);
  const vals = o.values, has = vals.filter(v => v != null);
  const padL = 46, padR = 10, padT = 10, padB = 22;
  const pw = w - padL - padR, ph = h - padT - padB;
  cv._pts = [];
  ctx.font = '11px -apple-system, sans-serif';
  if (!has.length || (o.type === 'bar' && !has.some(v => v > 0))) {
    ctx.fillStyle = '#6b6f76'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.empty || '這段期間沒有作答', w / 2, h / 2);
    return;
  }
  let max = o.max || Math.max(...has) || 1;
  if (!o.max) { const step = o.yfmt === fmtTime ? timeStep(max / 3) : niceStep(max / 3); max = Math.ceil(max / step) * step; }
  const y = v => padT + ph - (v / max) * ph;
  const n = vals.length, xw = pw / n, x = i => padL + xw * (i + 0.5);
  // 格線與 y 軸刻度（淡）
  ctx.strokeStyle = '#ebe6dc'; ctx.lineWidth = 1; ctx.fillStyle = '#6b6f76';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let k = 0; k <= 3; k++) {
    const v = max * k / 3, yy = Math.round(y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    ctx.fillText(o.yfmt ? o.yfmt(Math.round(v)) : String(Math.round(v)), padL - 6, yy);
  }
  // x 軸標籤：只標頭、中、尾
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i).forEach(i => {
    const lab = String(o.labels[i] || '').split(' ')[0];
    ctx.textAlign = i === 0 ? 'left' : i === n - 1 ? 'right' : 'center';
    ctx.fillText(lab, i === 0 ? padL : i === n - 1 ? w - padR : x(i), h - padB + 6);
  });
  const blue = '#2a78d6';
  if (o.type === 'bar') {
    const bw = Math.max(2, Math.min(18, xw - 2));
    ctx.fillStyle = blue;
    vals.forEach((v, i) => {
      if (!v) return;
      const top = y(v), bh = padT + ph - top, r = Math.min(4, bw / 2, bh);
      ctx.beginPath();
      ctx.moveTo(x(i) - bw / 2, padT + ph); ctx.lineTo(x(i) - bw / 2, top + r);
      ctx.quadraticCurveTo(x(i) - bw / 2, top, x(i) - bw / 2 + r, top);
      ctx.lineTo(x(i) + bw / 2 - r, top); ctx.quadraticCurveTo(x(i) + bw / 2, top, x(i) + bw / 2, top + r);
      ctx.lineTo(x(i) + bw / 2, padT + ph); ctx.closePath(); ctx.fill();
    });
  } else {
    ctx.strokeStyle = blue; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    let pen = false;
    vals.forEach((v, i) => { if (v == null) { pen = false; return; } pen ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)); pen = true; });
    ctx.stroke();
    vals.forEach((v, i) => {
      if (v == null) return;
      const c = o.pointColor?.[i];
      ctx.beginPath(); ctx.arc(x(i), y(v), c ? 5 : 3.5, 0, 7);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = c || blue; ctx.stroke();
      if (c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x(i), y(v), 2.5, 0, 7); ctx.fill(); }
    });
  }
  cv._pts = vals.map((v, i) => (v == null ? null : { x: x(i), y: o.type === 'bar' ? y(v) : y(v),
    text: `${o.labels[i]}：${o.fmt ? o.fmt(v) : v}${o.pointNote ? '・' + o.pointNote[i] : ''}` }));
  bindChartTip(cv);
}
function timeStep(v) { return [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600].map(x => x * 1000).find(x => x >= v) || 3600000; }
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function bindChartTip(cv) {
  if (cv._tipBound) return;
  cv._tipBound = true;
  const box = cv.parentElement;
  const tip = document.createElement('div'); tip.className = 'chart-tip hidden'; box.appendChild(tip);
  const show = e => {
    const r = cv.getBoundingClientRect(), px = e.clientX - r.left;
    let best = null, bd = 1e9;
    (cv._pts || []).forEach(p => { if (p && Math.abs(p.x - px) < bd) { bd = Math.abs(p.x - px); best = p; } });
    if (!best || bd > 30) { tip.classList.add('hidden'); return; }
    tip.textContent = best.text;
    tip.style.left = Math.min(Math.max(best.x + cv.offsetLeft, 70), box.clientWidth - 70) + 'px';
    tip.style.top = (best.y + cv.offsetTop) + 'px';
    tip.classList.remove('hidden');
  };
  cv.addEventListener('pointermove', show);
  cv.addEventListener('pointerdown', show);
  cv.addEventListener('pointerleave', () => tip.classList.add('hidden'));
}

/* =========================================================
   共用
   ========================================================= */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function switchTab(tab) {
  if (tab === 'edit' && !isAdmin()) tab = 'play';
  S.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  ['play', 'stats', 'edit', 'lib'].forEach(t => $('view-' + t).classList.toggle('active', t === tab));
  if (tab === 'stats') renderStats();
  if (tab === 'play') renderPlay();
  if (tab === 'edit') { if (!ed) newEditor(); else renderEditor(); }
  if (tab === 'lib') renderLib();
  window.scrollTo(0, 0);
}

/* ---------- 事件綁定 ---------- */
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) switchTab(b.dataset.tab); });
$('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.mode !== S.mode) { S.mode = b.dataset.mode; startProblem(); } });
$('btnReset').onclick = () => startProblem();
$('btnUndo').onclick = undoFree;
$('btnCheck').onclick = checkFree;
$('btnNext').onclick = nextProblem;
$('playGroup').onchange = e => onFilterChange('group', e.target.value);
$('libGroup').onchange = e => onFilterChange('group', e.target.value);
$('playCat').onchange = e => onFilterChange('cat', e.target.value);
$('libCat').onchange = e => onFilterChange('cat', e.target.value);
$('btnClearHist').onclick = () => {
  const p = curProblem(), g = prog(p.id);
  if (g.history.length && confirm(`清除「${p.title}」的作答紀錄清單？（統計數字不受影響）`)) { progW(p.id).history = []; touchProg(p.id); renderHistory(); }
};
bindBoardTap($('playBoard'), onPlayTap);
bindBoardTap($('editBoard'), onEditTap);

$('toolSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { ed.tool = b.dataset.tool; renderEditor(); } });
$('firstSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFirst(b.dataset.first); });
$('btnEdUndo').onclick = () => { ed.moves.pop(); renderEditor(); };
$('btnEdClear').onclick = () => { if (confirm('清空盤面上的所有棋子與手順？')) { ed.black = []; ed.white = []; ed.moves = []; ed.targets = []; renderEditor(); } };
$('btnEdNew').onclick = () => newEditor();
$('btnEdSave').onclick = saveEditor;
const refreshId = () => { if (!ed.origId) $('edId').value = suggestId($('edGroup').value, $('edCat').value); };
$('edCat').addEventListener('change', refreshId);
$('edGroup').addEventListener('change', refreshId);

$('libList').addEventListener('click', onLibClick);
let searchTimer;
$('libSearch').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderLib, 200); });
$('btnDelGroup').onclick = () => {
  const target = pool();
  if (!target.length) return;
  const name = S.cat === 'ALL' ? `大類「${S.group}」` : `「${S.group} · ${S.cat}」`;
  if (target.length >= deck.length) return toast('題庫至少要保留一題，不能刪除全部題目');
  if (!confirm(`確定要刪除${name}的全部 ${target.length} 題嗎？\n所有人的裝置同步後都會刪除。`)) return;
  deleteProblems(target.map(p => p.id));
  toast(`已刪除 ${target.length} 題`);
  S.group = 'ALL'; S.cat = 'ALL'; renderLib.key = null;
  if (!findProblem(S.current)) startProblem(deck[0].id);
  renderLib();
};
$('btnLibNew').onclick = () => { newEditor(); switchTab('edit'); };
$('btnExport').onclick = exportDeck;
$('btnImport').onclick = () => { $('importResult').innerHTML = ''; $('importModal').classList.add('open'); };
$('btnImportClose').onclick = () => $('importModal').classList.remove('open');
$('btnPickFile').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => runImport(String(rd.result));
  rd.onerror = () => { $('importResult').textContent = '讀取檔案失敗'; };
  rd.readAsText(f, 'utf-8');
  e.target.value = '';
};
$('btnImportRun').onclick = () => {
  const t = $('importText').value.trim();
  if (!t) return toast('請先貼上 JSON 內容，或選擇檔案');
  runImport(t);
};
$('btnReviewClose').onclick = () => $('reviewModal').classList.remove('open');
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

// 版面尺寸改變（旋轉 iPad、分割畫面）時重畫
let resizeTimer;
const redraw = () => { if (S.tab === 'play') drawBoard($('playBoard'), playView()); if (S.tab === 'edit' && ed) renderEditor(); };
let statResize;
window.addEventListener('resize', () => { if (S.tab === 'stats') { clearTimeout(statResize); statResize = setTimeout(renderStats, 150); } });
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(redraw, 80); });
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(redraw, 30); });
  document.querySelectorAll('.board-wrap').forEach(el => ro.observe(el));
}

applyRole();
cleanupLegacy();
newEditor();
startProblem(deck[0].id);
if (LOCAL_MODE) setSyncState('local');
else if (auth.token) { setSyncState('busy'); runSync(); }
else { $('loginName').value = auth.user ? auth.user.name : ''; setSyncState('login'); showLogin(); }
</script>
